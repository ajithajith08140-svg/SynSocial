<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SynSocial - Advanced CS Academic & Exam Resolution Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; }
    
    .navbar { background: #1e293b; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .logo { font-size: 22px; font-weight: bold; color: #38bdf8; }
    .nav-links span { color: #38bdf8; background: #334155; font-weight: bold; padding: 8px 14px; border-radius: 6px; }

    .main-container { display: flex; flex: 1; padding: 20px; gap: 20px; max-width: 1050px; margin: 0 auto; width: 100%; }
    .sidebar { width: 270px; background: #1e293b; padding: 20px; border-radius: 10px; height: fit-content; border: 1px solid #334155; }
    
    .view-section { flex: 1; }
    .card { background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #334155; position: relative; }
    
    textarea, input, select { width: 100%; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; margin-bottom: 10px; outline: none; }
    
    .search-box {
      width: 100%;
      background: #0f172a;
      border: 1px solid #38bdf8;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    
    .code-block { background: #0f172a; color: #38bdf8; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 13px; margin: 10px 0; border-left: 3px solid #38bdf8; white-space: pre-wrap; }
    .actions { display: flex; justify-content: space-between; color: #94a3b8; font-size: 14px; margin-top: 10px; align-items: center; }
    .action-btn { cursor: pointer; transition: 0.2s; }
    .action-btn:hover { opacity: 0.8; }

    /* Interactive Sidebar & Filter Items */
    .clickable-item {
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .clickable-item:hover {
      background: #334155;
    }
    .filter-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: #0f172a;
      color: #cbd5e1;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
      border: 1px solid #334155;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .filter-btn:hover, .filter-btn.active {
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* Modal Styling */
    .modal {
      display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.7); justify-content: center; align-items: center;
    }
    .modal-content {
      background-color: #1e293b; padding: 20px; border: 1px solid #38bdf8; border-radius: 8px;
      width: 80%; max-width: 500px; color: #fff; position: relative;
    }
    .close-btn { position: absolute; right: 15px; top: 10px; color: #aaa; font-size: 20px; cursor: pointer; }
    .close-btn:hover { color: #fff; }

    /* Custom Badges */
    .category-badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 4px;
      margin-bottom: 8px;
      margin-right: 5px;
    }
    .badge-exam { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #e74c3c; }
    .badge-sem { background: rgba(155, 89, 182, 0.2); color: #9b59b6; border: 1px solid #9b59b6; }
    .badge-solution { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid #2ecc71; }
    .badge-code { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid #38bdf8; }

    /* Solution Box */
    .solution-box {
      margin-top: 10px;
      padding: 10px;
      background: #0f172a;
      border-radius: 6px;
      border-left: 3px solid #2ecc71;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="logo">SynSocial</div>
    <div class="nav-links">
      <span>🎓 CS Exam Prep & Doubt Resolution Portal</span>
    </div>
  </div>

  <div class="main-container">
    <div class="sidebar">
      <img src="logo.jpeg" alt="College Logo" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; display: block; margin-left: auto; margin-right: auto;">
      
      <h3 style="color: #ffffff; font-size: 1.1rem; margin-bottom: 2px; text-align: center;">Voorhees College</h3>
      <p style="color: #38bdf8; font-size: 0.85rem; margin-bottom: 15px; text-align: center;">Dept. of Computer Science</p>
      
      <hr style="border: 0.5px solid #334155; margin-bottom: 15px;">

      <!-- Academic Semester Filters -->
      <p style="font-size: 0.75rem; color: #94a3b8; font-weight: bold; margin-bottom: 8px;">EXAM PREP FILTERS</p>
      <button class="filter-btn active" onclick="filterBySem('all')">🌐 All Posts & Materials</button>
      <button class="filter-btn" onclick="filterBySem('🔥 High Priority Exam Questions')">🔥 High Priority Exam Topics</button>
      <button class="filter-btn" onclick="filterBySem('Semester 1 & 2')">📘 1st Year (Sem 1 & 2)</button>
      <button class="filter-btn" onclick="filterBySem('Semester 3 & 4')">📗 2nd Year (Sem 3 & 4)</button>
      <button class="filter-btn" onclick="filterBySem('Semester 5 & 6')">📙 3rd Year (Sem 5 & 6)</button>

      <hr style="border: 0.5px solid #334155; margin: 15px 0;">

      <div class="quote-card clickable-item" onclick="openModal('Daily Tech Thought', document.getElementById('quoteText').innerText)" style="padding: 12px; background: #0f172a; border-radius: 6px; border-left: 3px solid #f39c12; text-align: left;">
          <p style="font-size: 0.75rem; color: #f39c12; font-weight: bold; margin-bottom: 5px;">💡 TECH THOUGHT 🔗</p>
          <p id="quoteText" style="font-size: 0.85rem; color: #dcdde1; font-style: italic; transition: opacity 0.4s ease-in-out;">
              Loading thought...
          </p>
      </div>

      <!-- Network Status Badge -->
      <div id="networkBadge" style="margin-top: 15px; padding: 8px; background: rgba(46, 204, 113, 0.1); border-radius: 5px; text-align: center;">
          <p id="statusText" style="color: #2ecc71; font-size: 0.8rem; margin: 0;">🌐 Campus Cloud Sync: Live</p>
      </div>
    </div>

    <div class="view-section">
      <input type="text" id="searchInput" class="search-box" oninput="searchPosts()" placeholder="🔍 Search exam questions, solutions, algorithms, semesters...">

      <div class="card">
        <h3 style="margin-bottom: 10px; color: #38bdf8;">Share CS Academic Query, Exam Question or Solution</h3>
        <input type="text" id="authorName" placeholder="Your Name / Student Roll No..." required />
        
        <div style="display: flex; gap: 10px;">
          <!-- Semester Category -->
          <select id="postSemester" style="flex: 1;">
            <option value="Semester 1 & 2">📘 1st Year (Sem 1 & 2)</option>
            <option value="Semester 3 & 4">📗 2nd Year (Sem 3 & 4)</option>
            <option value="Semester 5 & 6">📙 3rd Year (Sem 5 & 6)</option>
            <option value="General CS">💻 General CS / Lab</option>
          </select>

          <!-- Type Category -->
          <select id="postCategory" style="flex: 1;">
            <option value="🔥 High Priority Exam Questions">🔥 High Priority Exam Question</option>
            <option value="📝 Question with Solution">📝 Question & Solution</option>
            <option value="❓ Doubt / Need Help">❓ Doubt / Request Solution</option>
            <option value="💻 Lab Code & Algorithm">💻 Lab Program / Code</option>
          </select>
        </div>

        <textarea id="postContent" placeholder="Enter question description, university exam topic, or doubt details..."></textarea>
        <textarea id="codeContent" placeholder="// Enter code solution or step-by-step answer here (optional)..." style="height: 70px; font-family: monospace;"></textarea>
        <input type="url" id="resourceLink" placeholder="Paste Reference Drive / GitHub Link (optional)...">
        
        <label style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 5px;">Attach Question Paper Image / PDF Document (optional):</label>
        <input type="file" id="mediaInput" accept="image/*,.pdf,.doc,.docx" />
        
        <button id="publishBtn" onclick="publishPost()">Publish Academic Content</button>
      </div>

      <div id="feedList">
        <p style="color: #94a3b8;">Loading CS posts from Cloud DB...</p>
      </div>
    </div>
  </div>

  <!-- Dynamic Modal Popup -->
  <div id="infoModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h3 id="modalTitle" style="color: #38bdf8; margin-bottom: 10px;">Modal Title</h3>
      <p id="modalBody" style="line-height: 1.5; font-size: 14px; color: #cbd5e1;"></p>
    </div>
  </div>

  <script>
    const API_BASE = "https://synsocial.onrender.com/api/posts";
    const RENDER_BASE = "https://synsocial.onrender.com";
    let allPosts = [];
    let currentSemFilter = 'all';

    // Online/Offline Status Indicator
    function updateOnlineStatus() {
      const badge = document.getElementById('networkBadge');
      const text = document.getElementById('statusText');
      if (navigator.onLine) {
        badge.style.background = "rgba(46, 204, 113, 0.1)";
        text.style.color = "#2ecc71";
        text.innerText = "🌐 Campus Cloud Sync: Live (Online)";
      } else {
        badge.style.background = "rgba(243, 156, 18, 0.1)";
        text.style.color = "#f39c12";
        text.innerText = "⚠️ Offline Mode (Cached Data)";
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    // Modal Control
    function openModal(title, text) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalBody').innerText = text;
      document.getElementById('infoModal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('infoModal').style.display = 'none';
    }

    // Load Posts
    async function loadFeed() {
      try {
        const res = await fetch(API_BASE);
        allPosts = await res.json();
        localStorage.setItem('cached_posts', JSON.stringify(allPosts));
        filterBySem(currentSemFilter);
      } catch (err) {
        const cached = localStorage.getItem('cached_posts');
        if (cached) {
          allPosts = JSON.parse(cached);
          filterBySem(currentSemFilter);
        } else {
          document.getElementById('feedList').innerHTML = `<p style="color:#f43f5e;">Failed to connect to cloud database.</p>`;
        }
      }
    }

    function filterBySem(filterVal) {
      currentSemFilter = filterVal;

      let filtered = allPosts;
      if (filterVal !== 'all') {
        filtered = allPosts.filter(p => p.content.includes(filterVal));
      }

      renderPosts(filtered);
    }

    function toggleSolution(id) {
      const solBox = document.getElementById(`sol-${id}`);
      if (!solBox) return;
      solBox.style.display = solBox.style.display === 'block' ? 'none' : 'block';
    }

    function renderPosts(postsToDisplay) {
      const feedContainer = document.getElementById('feedList');
      feedContainer.innerHTML = '';

      if (!postsToDisplay || postsToDisplay.length === 0) {
        feedContainer.innerHTML = `<p style="color:#94a3b8;">No matching exam resources or questions found.</p>`;
        return;
      }

      postsToDisplay.forEach(post => {
        let attachmentHTML = '';
        if (post.filePath) {
          const isBase64 = post.filePath.startsWith('data:');
          const fileUrl = isBase64 ? post.filePath : `${RENDER_BASE}/${post.filePath.replace(/\\/g, '/')}`;
          
          if (isBase64 || post.filePath.match(/\.(jpg|jpeg|png|gif)$/i)) {
            attachmentHTML = `<div style="margin-top:10px;"><img src="${fileUrl}" alt="Attachment" style="max-width:100%; max-height:300px; border-radius:6px;"></div>`;
          } else {
            attachmentHTML = `<div style="margin-top:8px;"><a href="${fileUrl}" target="_blank" style="color:#38bdf8; text-decoration:none; font-weight:bold;">📎 Download Question Paper / Notes</a></div>`;
          }
        }

        feedContainer.innerHTML += `
          <div class="card">
            <div>
              <span class="category-badge badge-exam">🎓 CS Academic Hub</span>
            </div>

            <div style="display:flex; justify-content:space-between; color:#94a3b8; font-size:13px; margin-top:5px;">
              <strong>👤 ${post.author || 'CS Student'}</strong> <span>${new Date(post.createdAt).toLocaleTimeString()}</span>
            </div>
            
            <p style="margin-top:10px;">${post.content}</p>
            
            ${post.codeSnippet ? `
              <button onclick="toggleSolution('${post._id}')" style="margin-top:8px; padding:5px 10px; font-size:12px; background:#334155; color:#38bdf8; border:1px solid #38bdf8; border-radius:4px;">💡 View / Hide Verified Answer Solution</button>
              <div id="sol-${post._id}" class="solution-box">
                <strong>Verified Answer / Solution:</strong>
                <div class="code-block">${post.codeSnippet}</div>
              </div>
            ` : ''}

            ${post.resourceLink ? `<div style="margin-top:8px;"><a href="${post.resourceLink}" target="_blank" style="color:#38bdf8; text-decoration:none;">🔗 Open Reference Link</a></div>` : ''}
            ${attachmentHTML}
            
            <div class="actions">
              <span class="action-btn" onclick="likePost('${post._id}')">❤️ ${post.likes || 0} Helpful</span>
              <span class="action-btn" onclick="deletePost('${post._id}')" style="color:#f43f5e;">🗑️ Delete</span>
            </div>
          </div>
        `;
      });
    }

    function searchPosts() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filteredPosts = allPosts.filter(post => {
        const contentMatch = post.content ? post.content.toLowerCase().includes(query) : false;
        const codeMatch = post.codeSnippet ? post.codeSnippet.toLowerCase().includes(query) : false;
        const authorMatch = post.author ? post.author.toLowerCase().includes(query) : false;
        return contentMatch || codeMatch || authorMatch;
      });
      renderPosts(filteredPosts);
    }

    async function publishPost() {
      const author = document.getElementById('authorName').value.trim();
      const semester = document.getElementById('postSemester').value;
      const category = document.getElementById('postCategory').value;
      const content = document.getElementById('postContent').value.trim();
      const codeSnippet = document.getElementById('codeContent').value;
      const resourceLink = document.getElementById('resourceLink').value;
      const fileInput = document.getElementById('mediaInput');
      const btn = document.getElementById('publishBtn');

      if (!author) return alert("Please enter your Name or Roll Number!");
      if (!content) return alert("Please enter the question or topic description!");

      btn.disabled = true;
      btn.innerText = "Publishing Content...";

      const fullContent = `[${semester}] [${category}] ${content}`;

      const formData = new FormData();
      formData.append('author', author);
      formData.append('content', fullContent);
      formData.append('codeSnippet', codeSnippet);
      formData.append('resourceLink', resourceLink);
      
      if (fileInput.files[0]) {
        formData.append('file', fileInput.files[0]);
      }

      try {
        const response = await fetch(API_BASE, { method: 'POST', body: formData });
        if (!response.ok) throw new Error('Upload failed');

        document.getElementById('postContent').value = '';
        document.getElementById('codeContent').value = '';
        document.getElementById('resourceLink').value = '';
        fileInput.value = '';
        
        await loadFeed();
      } catch (err) {
        alert("The server is slow or offline. Please try again later!");
      } finally {
        btn.disabled = false;
        btn.innerText = "Publish Academic Content";
      }
    }

    async function likePost(id) {
      await fetch(`${API_BASE}/${id}/like`, { method: 'PUT' });
      loadFeed();
    }

    async function deletePost(id) {
      if (confirm("Are you sure you want to delete this resource permanently?")) {
        await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
        loadFeed();
      }
    }

    loadFeed();

    // Tech Quote
    let usedQuoteIndices = new Set();
    async function fetchDynamicQuote() {
      const quoteElement = document.getElementById('quoteText');
      if (!quoteElement) return;

      quoteElement.style.opacity = 0;

      setTimeout(async () => {
        try {
          const res = await fetch('https://dummyjson.com/quotes/random');
          const data = await res.json();
          quoteElement.innerText = `"${data.quote}" — ${data.author}`;
        } catch (err) {
          const backupQuotes = [
            { quote: "Talk is cheap. Show me the code.", author: "Linus Torvalds" },
            { quote: "Programs must be written for people to read.", author: "Harold Abelson" },
            { quote: "First, solve the problem. Then, write the code.", author: "John Johnson" }
          ];
          const q = backupQuotes[Math.floor(Math.random() * backupQuotes.length)];
          quoteElement.innerText = `"${q.quote}" — ${q.author}`;
        }
        quoteElement.style.opacity = 1;
      }, 400);
    }
    fetchDynamicQuote();
    setInterval(fetchDynamicQuote, 20000);
  </script>
</body>
</html>
