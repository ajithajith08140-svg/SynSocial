<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Example</title>
  
  <!-- 1. Browser Tab Logo (Favicon) -->
  <link rel="icon" type="image/png" href="YOUR_IMAGE_LINK_HERE">

  <style>
    /* Navigation Bar Styling */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #333;
      padding: 10px 20px;
    }

    /* Logo Size Control */
    .logo-container img {
      height: 50px; /* உங்கள் தேவைக்கேற்ப உயரத்தை மாற்றிக்கொள்ளலாம் */
      width: auto;  /* படம் சுருங்காமல் இருக்க auto கொடுக்கப்பட்டுள்ளது */
      display: block;
    }

    /* Menu Styling */
    .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <!-- 2. Main Webpage Logo -->
    <div class="logo-container">
      <a href="#">
        
        <img src="" alt="Company Logo">
      </a>
    </div>

    <!-- Navigation Menu -->
    <nav>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

</body>
</html>
